[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "truss-lan"
version = "0.1.0"
description = "Shared-capacity protocol demonstrator: protected baselines and expiring authority"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "paho-mqtt>=2.1,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7"]

[project.scripts]
truss = "truss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
